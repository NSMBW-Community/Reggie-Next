name: Build

on:
  push:
    branches:
      - master

jobs:
  build:

    strategy:
      matrix:
        include:
          - build-name: 'Windows'
            python-version: "3.12"
            platform: windows-latest
            arch: 'x64'
          - build-name: 'macOS'
            python-version: "3.12"
            platform: macos-latest
            arch: 'x64'
          - build-name: 'Ubuntu'
            python-version: "3.12"
            platform: ubuntu-latest
            arch: 'x64'

    name: ${{ matrix.build-name }}

    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.arch }}
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install wheel
        python -m pip install PyQt6 nsmblib PyInstaller
    - name: Build
      shell: bash
      run: python -OO build_reggie.py
    - name: Tar (macOS/Linux)
      if: ${{ runner.os == 'macOS' || runner.os == 'Linux' }}
      run: |
        cd distrib
        tar -czvf ../build-${{ matrix.platform }}.tar.gz ./*
        cd ..
    - name: Upload artifacts (Windows)
      if: ${{ runner.os == 'Windows' }}
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.platform }}
        path: distrib/*
    - name: Upload artifacts (macOS/Linux)
      if: ${{ runner.os == 'macOS' || runner.os == 'Linux' }}
      uses: actions/upload-artifact@v7
      with:
        path: build-${{ matrix.platform }}.tar.gz
        archive: false

  release:
    name: Publish nightly release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: _artifacts

    - name: Prepare nightly release
      uses: softprops/action-gh-release@v3
      with:
        name: 'Nightly Build'
        tag_name: nightly
        draft: true
        prerelease: true
        make_latest: false
        generate_release_notes: false
        body: 'Automated builds created from the [most recent commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).'
        files: _artifacts/*

    - name: Publish release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release edit "nightly" --draft=false
